name: artifact-contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate report checksums and generated first fold
        run: python scripts/artifact_manifest.py --check

  space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRNTI_DEVICE: cpu
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve a 20 GiB reserve before environment setup
        run: |
          python - <<'PY'
          import shutil
          assert shutil.disk_usage('.').free >= 25 * 1024**3, 'Insufficient peak setup budget'
          PY
      - name: Install standalone demo dependencies with CPU wheels
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r space/requirements-dev.txt
      - name: Lint and compile the production root
        run: |
          python -m ruff check space
          python -m ruff format --check space
          python -m compileall -q space
      - name: Render production root and validate visitor-facing contracts
        run: python -m pytest space/test_app.py -q -o addopts=
